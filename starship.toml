

# =========================================================================
# Prompt styles — colored with the Noctalia palette.
# This section lives outside the Noctalia marker block above, so it is
# preserved across Noctalia theme refreshes (only the palette block is
# rewritten). Tracked in git via the noctalia-starship clean filter.
# =========================================================================

# Format: follows Starship's default order, recolored via noctalia palette
format = """$username$hostname$directory$git_branch$git_state$git_status\
$cmd_duration$fill$jobs$time$line_break\
$character"""

# Right-aligned fill between left modules and the clock
[fill]
symbol = " "

# --- Username / hostname (shown only on SSH or root) ---
[username]
show_always = false
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "bold green"
format = "[$hostname]($style) "

# --- Directory ---
[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

# --- Git ---
[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_state]
style = "bright-black"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "bold green"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕↑${ahead_count}↓${behind_count}"
untracked = "?$count"
stashed = "=$count"
modified = "!$count"
staged = "+$count"
renamed = "»$count"
deleted = "✘$count"
conflicted = "=$count"
format = '([\[$all_status$ahead_behind\]]($style) )'

# --- Command duration (only shown when > 2s) ---
[cmd_duration]
min_time = 2_000
style = "bright-black"
format = "[$duration]($style) "

# --- Language runtimes ---
[python]
symbol = " "
style = "yellow"
format = '[${symbol}${pyenv_prefix}(${version})( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
style = "peach"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "sky"
format = "[$symbol($version)]($style) "

[lua]
symbol = " "
style = "blue"
format = "[$symbol($version)]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol($version)]($style) "

[package]
symbol = "󰏗 "
style = "bright-black"
format = "[$symbol$version]($style) "

# --- Background jobs indicator ---
[jobs]
symbol = "%"
style = "bold red"
format = "[$symbol$number]($style) "

# --- Clock (right side) ---
[time]
disabled = false
use_12hr = false
style = "bright-black"
format = "[$time]($style)"

# --- Prompt character ---
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

