[bar.default]
background_opacity = 0.33999999240040779
capsule = true
center = [ "active_window" ]
end = [
    "group:g1",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session",
    "clock"
]
font_family = "FantasqueSansM Nerd Font"
font_weight = 700
margin_edge = 0
margin_ends = 0
radius = 0
scale = 0.95000000670552254
shadow = false
thickness = 24
widget_spacing = 3

    [[bar.default.capsule_group]]
    fill = "on_primary"
    id = "g1"
    members = [ "cpu", "network_tx", "network_rx" ]
    opacity = 1.0
    padding = 6.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 1081.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
settings_show_advanced = true

    [shell.panel]
    control_center_placement = "floating"
    launcher_position = "auto"
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_wallpaper = true
    wallpaper_placement = "floating"

[theme]
builtin = "Noctalia"
custom_palette = "purple-star-mc"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "kitty" ]
    enable_builtin_templates = true

        [theme.templates.user.sway-borders]
        input_path = "~/.config/noctalia/templates/sway-borders"
        output_path = "~/.config/sway/colors.conf"
        post_hook = "swaymsg reload"

[wallpaper]
directory = "/home/mic/Pictures/wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/mic/Pictures/wallpapers/Lofi - Anime Girl2.png"

    [wallpaper.last]
    path = "/home/mic/Pictures/wallpapers/Lofi - Anime Girl2.png"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/mic/Pictures/wallpapers/Lofi - Anime Girl2.png"

[widget.network]
show_label = false

[widget.workspaces]
display = "none"