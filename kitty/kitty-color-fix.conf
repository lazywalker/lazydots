# Override Noctalia's pale light-mode highlight colors (16-color slots).
# Noctalia writes near-white pastels that vanish on a light bg; these read on
# both light and dark surfaces. Export COLORFGBG so truecolor TUI apps (ink
# based, like codebuddy) drop dark-theme blues for dark-on-light colors.
color3  #7a5c00
color4  #1565c0
color5  #9d4edd
color6  #0073a8
color8  #5b5566
color11 #7a5c00
color12 #1565c0
color13 #9d4edd
color14 #0073a8
env COLORFGBG=0;15
