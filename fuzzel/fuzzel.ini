# fuzzel config — dmenu-style window switcher for Sway
# Matching the Catppuccin Mocha aesthetic

[main]
font=FantasqueSansM Nerd Font Mono:size=14
dpi-aware=auto
include=/home/mic/.config/fuzzel/themes/noctalia

[colors]
; background=1e1e2edd
; text=cdd6f4ff
; match=89b4faff
; selection=89b4fa33
; selection-text=89b4faff
; border=45475aff
; Override Noctalia-generated theme for the shortcut cheatsheet (keyhint.sh).
; Background alpha (last two hex digits) reference:
;   FF = 100% opaque   EE ≈ 93%   E6 = 90%   CC = 80% (default)   DD ≈ 87%
background=111418CC

[border]
width=1
radius=12

